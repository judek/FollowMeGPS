
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FollowMeGPS - Live Location</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/10.0.0/signalr.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #header {
            padding: 14px;
            background: #1677d2;
            color: white;
        }

        #header h2 {
            margin: 0;
            font-size: 20px;
        }

        #status {
            font-size: 13px;
            margin-top: 5px;
        }

        #map {
            height: calc(100vh - 85px);
            width: 100%;
        }
    </style>
</head>

<body>

    <div id="header">
        <h2 id="displayName">FollowMeGPS</h2>
        <div id="status">Connecting...</div>
    </div>

    <div id="map"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");

        const displayNameElement =
            document.getElementById("displayName");

        const statusElement =
            document.getElementById("status");

        let marker = null;
        let connection = null;

        const map = L.map("map").setView([27.9, -82.5], 13);

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution: "&copy; OpenStreetMap contributors"
            }
        ).addTo(map);

        function setStatus(message) {
            statusElement.textContent = message;
        }

        async function startViewer() {
            if (!token) {
                setStatus("Invalid viewer link.");
                return;
            }

            try {
                connection = new signalR.HubConnectionBuilder()
                    .withUrl("/locationHub")
                    .withAutomaticReconnect()
                    .build();

                connection.on("LocationUpdated",
                    (latitude, longitude, updatedAt) => {
                        const position = [latitude, longitude];

                        if (!marker) {
                            marker = L.marker(position).addTo(map);
                            marker.bindPopup(displayNameElement.textContent);
                        } else {
                            marker.setLatLng(position);
                        }

                        marker.setPopupContent(
                            displayNameElement.textContent
                        );

                        map.setView(position, 16);

                        const updateTime = new Date(updatedAt);

                        setStatus(
                            "Location updated: " +
                            updateTime.toLocaleTimeString()
                        );
                    });

                connection.on("SharingStopped", () => {
                    setStatus("Sharing has stopped.");

                    if (marker) {
                        map.removeLayer(marker);
                        marker = null;
                    }
                });

                connection.onreconnecting(() => {
                    setStatus("Connection lost. Reconnecting...");
                });

                connection.onreconnected(() => {
                    setStatus("Reconnected. Waiting for location...");
                    joinSession();
                });

                connection.onclose(() => {
                    setStatus("Disconnected from server.");
                });

                await connection.start();

                const displayName = await connection.invoke(
                    "GetDisplayName",
                    token
                );

                if (!displayName) {
                    setStatus("Invalid or expired viewer link.");
                    return;
                }

                displayNameElement.textContent = displayName;

                await joinSession();

            } catch (err) {
                console.error(err);
                setStatus("Unable to connect to FollowMeGPS.");
            }
        }

        async function joinSession() {
            if (!connection ||
                connection.state !== signalR.HubConnectionState.Connected) {
                return;
            }

            const joined = await connection.invoke(
                "JoinSession",
                token
            );

            if (joined) {
                setStatus("Connected. Waiting for location...");
            } else {
                setStatus("Invalid or expired viewer link.");
            }
        }

        startViewer();

    </script>

</body>
</html>
